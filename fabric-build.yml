name: LeadShot 26.3 real Fabric compile
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Source-level regression
        run: bash tools/verify-local.sh
      - name: Compile and package Minecraft 26.3
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          gradle --no-daemon --stacktrace clean build 2>&1 | tee ci-logs/fabric-compile.log
      - name: Upload compile diagnostics (also on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LeadShot-compile-diagnostics
          path: ci-logs/fabric-compile.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LeadShot-Fabric-26.3-alpha
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar


name: LeadShot Fabric 26.3 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Fabric project structure
        run: |
          mkdir -p src/main/java/dev/leadshot
          mkdir -p src/main/resources/assets/leadshot/lang
          mkdir -p tools

          for file in *.java; do
            case "$file" in
              *Test.java)
                cp "$file" tools/
                ;;
              *)
                cp "$file" src/main/java/dev/leadshot/
                ;;
            esac
          done

          cp fabric.mod.json src/main/resources/
          cp en_us.json src/main/resources/assets/leadshot/lang/
          cp ja_jp.json src/main/resources/assets/leadshot/lang/

          for file in *.sh *.py; do
            if [ -f "$file" ]; then
              cp "$file" tools/
            fi
          done

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Compile LeadShot
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LeadShot-build-diagnostics
          path: build/reports/

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LeadShot-Fabric-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
